<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문파원 · 짐승특공대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:#14163a;color:#eef0ff;font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
:root{--gold:#f2b84b;--vice:#3fc7b4;--mem:#9b6bff;--card:#1d2152;--card2:#252a62;--muted:#b3b7df}
.serif{font-family:"Gowun Batang",serif;font-weight:700}

/* ── 상단 배너 ── */
.top{position:relative;overflow:hidden;text-align:center;padding:56px 20px 40px;
  background:radial-gradient(ellipse 50% 80% at 70% 0%,rgba(170,140,220,.35),transparent 70%),linear-gradient(180deg,#1b1d4d,#2b3478 70%,#14163a)}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.top h1{margin:0;font-size:clamp(40px,8vw,72px);line-height:1.05;color:#fff;text-shadow:0 0 26px rgba(190,200,255,.45)}
.top .lead{margin:0;color:#d9d6f5;font-size:15px}
.next{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 34px;border-radius:16px;
  background:rgba(12,14,40,.55);border:1px solid rgba(255,217,138,.35);box-shadow:0 0 40px rgba(255,190,100,.12)}
.next .lbl{font-size:13px;letter-spacing:.12em;color:#ffd98a}
.next .cd{font-size:clamp(48px,9vw,76px);line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,217,138,.45)}
.next .cd small{font-size:.4em;margin-left:4px;color:#f3e6c4}
.next .at{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.next .at b{color:#fff}

.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 72px;display:flex;flex-direction:column;gap:28px}

/* ── 공통 카드 ── */
.bt{--c:#fff;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;overflow:hidden}
.bt-head{display:flex;gap:16px;align-items:center;padding:20px 22px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 26%,#1d2152),#1d2152 75%);border-bottom:3px solid color-mix(in srgb,var(--c) 70%,transparent)}
.bt-head svg.emb{width:62px;height:76px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.bt-head .tt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.bt-head h3{margin:0;font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;color:#fff;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bt-head h3 .no{font-size:15px;color:var(--c);letter-spacing:.08em}
.bt-head h3 .cnt{font-size:16px;color:var(--c)}
.bt-head .sub{font-size:13.5px;color:var(--muted)}
.bt-body{padding:22px;display:flex;flex-direction:column;gap:16px}

/* ── 운영진 ── */
.staff{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.pf{--c:#fff;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 16px 22px;border-radius:16px;
  background:linear-gradient(170deg,color-mix(in srgb,var(--c) 22%,#252a62),#252a62 70%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.pf .role{font-size:12px;font-weight:700;letter-spacing:.12em;padding:2px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.pf .av{width:84px;height:84px;font-size:36px}
.pf .nm{font-family:"Gowun Batang",serif;font-weight:700;font-size:26px;color:#fff;line-height:1.2;word-break:keep-all}
.pf.lead{--c:var(--gold);box-shadow:0 0 40px rgba(242,184,75,.15)}
.pf.lead .av{width:104px;height:104px;font-size:44px;box-shadow:0 0 0 4px rgba(242,184,75,.35),0 0 30px rgba(242,184,75,.4)}
.pf.lead .nm{font-size:32px;color:#ffd98a}
.pf.lead .crown{font-size:26px;line-height:1;margin:-8px 0 -2px}
.pf.vice{--c:var(--vice)}

/* 아바타 */
.av{display:grid;place-items:center;border-radius:50%;font-family:"Gowun Batang",serif;font-weight:700;color:#fff;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--h) 85%,#fff),var(--h) 60%,color-mix(in srgb,var(--h) 60%,#000));
  border:2px solid rgba(255,255,255,.18);text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* ── 문파원 목록 ── */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid rgba(255,255,255,.1)}
.search:focus-within{border-color:var(--mem)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:15px}
.search input::placeholder{color:#8a8db8}
.seg{display:flex;border-radius:12px;background:var(--card2);padding:4px;border:1px solid rgba(255,255,255,.1)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:700;padding:6px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--mem);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.mc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid rgba(255,255,255,.06);transition:transform .2s,border-color .2s}
.mc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--h) 70%,transparent)}
.mc .av{width:42px;height:42px;font-size:18px}
.mc .nm{font-size:15px;font-weight:700;color:#fff;line-height:1.3;word-break:break-all}
.mc .no{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc mark{background:rgba(155,107,255,.35);color:#fff;border-radius:3px;padding:0 1px}
.empty{display:none;text-align:center;padding:24px;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:0}

@media (max-width:760px){.staff{grid-template-columns:1fr 1fr}.pf.lead{grid-column:1/-1}}
@media (max-width:640px){.bt-head svg.emb{width:50px;height:62px}.bt-body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mc{padding:10px}.mc .av{width:36px;height:36px;font-size:16px}.mc .nm{font-size:14px}.pf .nm{font-size:22px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.mc{transition:none}}
</style>
</head>
<body>
<header class="gnb">
  <a class="logo" href="index.html">짐승특공대<small>도깨비의 세계 문파</small></a>
  <nav>

    <a href="https://forum.kakaogames.com/dokkaebi" target="_blank" rel="noopener"><span class="pc">공식 </span>커뮤니티 ↗</a>

</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="pennant" d="M6 2 H54 V58 L30 74 L6 58 Z"/>
    <symbol id="ic-staff" viewBox="0 0 60 76"><use href="#pennant" fill="#4a3412" stroke="#f2b84b" stroke-width="3"/>
      <path d="M14 40 L17 20 L24 29 L30 16 L36 29 L43 20 L46 40 Z" fill="#ffe7a8"/><rect x="14" y="42" width="32" height="5" rx="2" fill="#ffe7a8"/>
      <circle cx="30" cy="31" r="3" fill="#c98a1c"/><circle cx="21" cy="34" r="2" fill="#c98a1c"/><circle cx="39" cy="34" r="2" fill="#c98a1c"/></symbol>
    <symbol id="ic-mem" viewBox="0 0 60 76"><use href="#pennant" fill="#3b2470" stroke="#9b6bff" stroke-width="3"/>
      <circle cx="30" cy="22" r="6.5" fill="#e9dcff"/><path d="M18 44 q0 -14 12 -14 q12 0 12 14 Z" fill="#e9dcff"/>
      <circle cx="16" cy="27" r="4.5" fill="#e9dcff" opacity=".6"/><path d="M8 44 q0 -10 8 -10 q4 0 6 2" fill="#e9dcff" opacity=".6"/>
      <circle cx="44" cy="27" r="4.5" fill="#e9dcff" opacity=".6"/><path d="M52 44 q0 -10 -8 -10 q-4 0 -6 2" fill="#e9dcff" opacity=".6"/></symbol>
  </defs>
</svg>

<section class="top">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="top-in">
    <h1 class="serif">문파원</h1>
    <p class="lead">함께 도깨비의 세계를 누비는 짐승특공대 식구들</p>
    <div class="next">
      <span class="lbl">현재 문파 인원</span>
      <span class="cd serif" id="total">-<small>명</small></span>
      <span class="at"><span>문주 <b>1</b></span><span>부문주 <b id="cV">-</b></span><span>문파원 <b id="cM">-</b></span></span>
    </div>
  </div>
</section>

<main class="wrap">

  <article class="bt" style="--c:var(--gold)">
    <div class="bt-head">
      <svg class="emb" aria-hidden="true"><use href="#ic-staff"/></svg>
      <div class="tt"><h3><span class="no">01</span>운영진</h3><span class="sub">궁금한 점, 휴가·출장 언질은 운영진에게 편하게 말해 주세요.</span></div>
    </div>
    <div class="bt-body">
      <div class="staff" id="staff"></div>
    </div>
  </article>

  <article class="bt" style="--c:var(--mem)">
    <div class="bt-head">
      <svg class="emb" aria-hidden="true"><use href="#ic-mem"/></svg>
      <div class="tt"><h3><span class="no">02</span>문파원 <span class="cnt" id="mCount"></span></h3><span class="sub">이름으로 찾아볼 수 있어요.</span></div>
    </div>
    <div class="bt-body">
      <div class="tools">
        <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="문파원 이름 검색" aria-label="문파원 이름 검색"></label>
        <div class="seg" role="group" aria-label="정렬">
          <button type="button" data-sort="join" aria-pressed="true">명단순</button>
          <button type="button" data-sort="name" aria-pressed="false">가나다순</button>
        </div>
      </div>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty">찾는 이름이 없어요.</p>
      <p class="note">명단에 빠진 분이나 바뀐 닉네임이 있으면 운영진에게 알려 주세요.</p>
    </div>
  </article>

</main>

<script src="members.js?v=1"></script>
<script>
(function(){
  var G=window.GUILD;
  var pal=['#9b6bff','#3fc7b4','#ff8fb5','#f2b84b','#5aa9ff','#ff8a7a','#7ed66f','#c58cff','#4fd1e8','#ffb36b'];
  function hue(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return pal[h%pal.length];}
  function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function av(n,cls){return '<span class="av '+(cls||'')+'" style="--h:'+hue(n)+'" aria-hidden="true">'+esc(Array.from(n)[0])+'</span>';}

  document.getElementById('total').innerHTML=(1+G.vice.length+G.members.length)+'<small>명</small>';
  document.getElementById('cV').textContent=G.vice.length;
  document.getElementById('cM').textContent=G.members.length;
  document.getElementById('mCount').textContent=G.members.length+'명';

  document.getElementById('staff').innerHTML=
    '<div class="pf lead"><span class="crown" aria-hidden="true">👑</span><span class="role">문주</span>'+av(G.leader)+'<span class="nm">'+esc(G.leader)+'</span></div>'+
    G.vice.map(function(n){return '<div class="pf vice"><span class="role">부문주</span>'+av(n)+'<span class="nm">'+esc(n)+'</span></div>';}).join('');

  var list=G.members.map(function(n,i){return {n:n,i:i+1};}), sort='join';
  var grid=document.getElementById('grid'), q=document.getElementById('q'), empty=document.getElementById('empty');
  function render(){
    var k=q.value.trim().toLowerCase();
    var arr=list.slice();
    if(sort==='name') arr.sort(function(a,b){return a.n.localeCompare(b.n,'ko');});
    arr=arr.filter(function(m){return !k||m.n.toLowerCase().indexOf(k)>-1;});
    grid.innerHTML=arr.map(function(m){
      var nm=esc(m.n);
      if(k){var p=m.n.toLowerCase().indexOf(k);nm=esc(m.n.slice(0,p))+'<mark>'+esc(m.n.slice(p,p+k.length))+'</mark>'+esc(m.n.slice(p+k.length));}
      return '<li class="mc" style="--h:'+hue(m.n)+'">'+av(m.n)+'<span><span class="nm">'+nm+'</span><br><span class="no">No. '+String(m.i).padStart(2,'0')+'</span></span></li>';
    }).join('');
    empty.style.display=arr.length?'none':'block';
  }
  q.addEventListener('input',render);
  [].forEach.call(document.querySelectorAll('.seg button'),function(b){
    b.addEventListener('click',function(){sort=b.dataset.sort;
      [].forEach.call(document.querySelectorAll('.seg button'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});render();});
  });
  render();

  var c=document.getElementById('sky'),x=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),st=[];
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){c.width=c.offsetWidth*dpr;c.height=c.offsetHeight*dpr;st=[];var n=Math.round(c.offsetWidth*c.offsetHeight/2400);
    for(var i=0;i<n;i++)st.push({x:Math.random()*c.width,y:Math.random()*c.height,r:(Math.random()*1.2+.3)*dpr,p:Math.random()*6.28,s:Math.random()*.02+.005});}
  function draw(){x.clearRect(0,0,c.width,c.height);for(var i=0;i<st.length;i++){var s=st[i];s.p+=s.s;x.globalAlpha=.3+.7*Math.abs(Math.sin(s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}
    if(!still)requestAnimationFrame(draw);}
  size();draw();window.addEventListener('resize',function(){size();if(still)draw();});
})();
</script>
</body>
</html>
