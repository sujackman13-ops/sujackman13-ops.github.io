<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짐승특공대 · 도깨비의 세계 문파</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#16183a;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif}

/* ── 첫 화면 ── */
.hero{position:relative;min-height:calc(100svh - 60px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(ellipse 40% 70% at 68% 20%,rgba(170,140,220,.35),transparent 70%),
    radial-gradient(ellipse 60% 40% at 30% 10%,rgba(90,110,200,.35),transparent 70%),
    linear-gradient(180deg,#1b1d4d 0%,#2b3478 45%,#5a6ab0 78%,#8a90c8 100%)}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.moon{position:absolute;top:9%;right:12%;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fffbe8,#f3e4b0 60%,#d9c48a);
  box-shadow:0 0 40px 10px rgba(255,240,190,.35),0 0 120px 40px rgba(255,240,190,.12)}
@media (max-width:600px){.moon{top:3%;right:7%;width:44px;height:44px}}
.land{position:absolute;left:0;right:0;bottom:0;height:68%;pointer-events:none;
  background:url(hero-land.jpg) center 62%/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 38%);mask-image:linear-gradient(to bottom,transparent 0,#000 38%)}
.land::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(transparent,#16183a)}
@media (max-width:600px){.land{height:58%;background-position:38% 62%}}
.mist{position:absolute;left:-10%;right:-10%;bottom:8%;height:22%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(220,225,255,.28),transparent 65%);filter:blur(10px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}

.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 20px 18vh}
.kicker{font-size:14px;letter-spacing:.3em;color:#d9cfee;opacity:.9}
.title{font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(56px,12vw,124px);line-height:1;margin:0;
  color:#fff;letter-spacing:.04em;text-shadow:0 2px 0 rgba(30,30,80,.4),0 0 30px rgba(190,200,255,.45)}
.tagline{font-size:clamp(20px,3.2vw,32px);font-family:"Gowun Batang",serif;font-weight:700;color:#f2efff;margin:0;text-shadow:0 2px 10px rgba(20,20,60,.5)}
.clock{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0 4px;font-family:"Gowun Batang",serif;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(30,30,80,.4),0 0 18px rgba(190,200,255,.4)}
.clock .cd{font-size:clamp(14px,1.8vw,18px);color:#e6e0ff;letter-spacing:.06em}
.clock .ct{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.clock .nx{margin-top:8px;display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 16px;border-radius:999px;background:rgba(12,14,40,.45);border:1px solid rgba(255,217,138,.35);color:#f3e6c4;text-decoration:none;font-size:clamp(14px,1.8vw,17px);text-shadow:none}
.clock .nx:hover{border-color:#ffd98a}
.clock .nx .nxl{font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:#ffd98a}
.clock .nx b{color:#fff;font-variant-numeric:tabular-nums}
.plaque{display:inline-flex;align-items:center;gap:12px;margin-top:6px;padding:12px 26px;border-radius:6px;
  font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(17px,2.4vw,24px);color:#3a2a14;text-decoration:none;
  background:linear-gradient(#efe4cc,#d9c9a6);border:2px solid #8a6a3a;
  box-shadow:inset 0 0 0 3px #efe4cc,inset 0 0 0 4px #8a6a3a,0 6px 20px rgba(0,0,0,.35);transition:transform .2s}
.plaque:hover{transform:translateY(-2px)}
.go{margin-top:22px;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
  background:radial-gradient(circle,#4a2a14 55%,#2a160a 70%);border:3px solid #e8a85a;
  box-shadow:0 0 0 6px rgba(42,22,10,.6),0 0 30px rgba(255,170,80,.45);animation:pulse 2.6s ease-in-out infinite;position:relative}
.go::before,.go::after{content:"";position:absolute;width:14px;height:14px;border:2px solid #e8a85a;border-width:2px 2px 0 0;top:50%}
.go::before{left:-26px;transform:translateY(-50%) rotate(-135deg)}
.go::after{right:-26px;transform:translateY(-50%) rotate(45deg)}
.go svg{width:46px;height:46px}
.go span{position:absolute;bottom:-30px;font-size:13px;color:#f6e7c8;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(42,22,10,.6),0 0 24px rgba(255,170,80,.35)}50%{box-shadow:0 0 0 6px rgba(42,22,10,.6),0 0 44px rgba(255,170,80,.7)}}
.leaf{position:absolute;top:-20px;width:12px;height:7px;border-radius:0 100% 0 100%;background:#9fbf5a;opacity:.75;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}

/* ── 최신 업데이트 ── */
.latest{background:#16183a;padding:56px 20px 72px}
.latest .in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.latest h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:30px;margin:0}
.latest .sub{color:#a9acd0;font-size:14px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ucard{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:14px;text-decoration:none;color:#fff;
  background:linear-gradient(160deg,#23275a,#1c1f4a);border:1px solid rgba(255,255,255,.08);transition:transform .2s,border-color .2s}
.ucard:hover{transform:translateY(-3px);border-color:#ffd98a}
.ucard .d{font-size:12px;color:#ffd98a;font-weight:700;letter-spacing:.05em}
.ucard .t{font-family:"Do Hyeon",sans-serif;font-size:22px}
.ucard .s{font-size:13px;color:#b9bce0;line-height:1.6}
.ucard .new{align-self:flex-start;font-size:11px;font-weight:700;background:#e8a85a;color:#2a160a;padding:2px 8px;border-radius:99px}
.more{align-self:flex-start;color:#ffd98a;text-decoration:none;font-size:14px;font-weight:700}
footer{background:#111330;color:#7d80a8;font-size:12px;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){.mist,.go,.leaf{animation:none}.leaf{display:none}}
</style>
</head>
<body>
<header class="gnb">
  <a class="logo" href="index.html">짐승특공대<small>공월아1</small></a>
  <nav>
    <a href="index.html" class="on">홈</a>
    <a href="notice.html">문파 공지</a>
    <a href="members.html">문파원</a>
    <a href="battle.html">문파 전투</a>
    <a href="updates.html">업데이트</a>
    <a href="https://forum.kakaogames.com/dokkaebi" target="_blank" rel="noopener"><span class="pc">공식 </span>커뮤니티 ↗</a>
  </nav>
</header>

<section class="hero">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="moon" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="land" aria-hidden="true"></div>

  <div class="hero-in">
    <span class="kicker">도깨비의 세계 · 공월아1</span>
    <h1 class="title">짐승특공대</h1>
    <p class="tagline">함께라서 더 즐거운 도깨비의 세계</p>
    <div class="clock" aria-live="off"><span class="cd" id="clkDate"></span><span class="ct" id="clkTime">--:--:--</span><a class="nx" id="nx" href="battle.html"><span class="nxl">다음 문파 일정</span><span id="nxName">-</span><b id="nxCd">-</b></a></div>
    <a class="plaque" id="latestPlaque" href="updates.html">✦ <span>업데이트 브리핑 보기</span> ✦</a>
    <a class="go" id="latestGo" href="updates.html" aria-label="최신 업데이트 브리핑 열기">
      <svg viewBox="0 0 48 48"><path d="M10 8 L40 24 L10 40 L18 24Z" fill="#f4b768"/><path d="M18 24 L40 24" stroke="#4a2a14" stroke-width="2"/></svg>
      <span>최신 브리핑</span>
    </a>
  </div>
</section>

<section class="latest">
  <div class="in">
    <div><h2>최신 업데이트</h2><p class="sub">정기 라이브·공지 내용을 문파원용으로 정리했어요.</p></div>
    <div class="cards" id="cards"></div>
    <a class="more" href="updates.html">업데이트 전체 보기 →</a>
  </div>
</section>

<footer>짐승특공대 문파 비공식 페이지 · 게임 관련 정보의 출처는 각 브리핑 하단에 있어요.</footer>

<script src="updates.js?v=2"></script>
<script src="schedule.js?v=2"></script>
<script>
(function(){
  /* 최신 브리핑 연결 + 카드 3개 */
  var list=(window.UPDATES||[]).slice(0,3);
  if(list[0]){
    document.getElementById('latestPlaque').href=list[0].file;
    document.getElementById('latestPlaque').querySelector('span').textContent=list[0].title;
    document.getElementById('latestGo').href=list[0].file;
  }
  document.getElementById('cards').innerHTML=list.map(function(u,i){
    return '<a class="ucard" href="'+u.file+'">'+(i===0?'<span class="new">NEW</span>':'')+
      '<span class="d">'+u.date+'</span><span class="t">'+u.title+'</span><span class="s">'+u.summary+'</span></a>';
  }).join('');

  /* 실시간 시계 (한국 시간) */
  var dEl=document.getElementById('clkDate'),tEl=document.getElementById('clkTime');
  var fd=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
  var ft=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  function tick(){var n=new Date(),p={};fd.formatToParts(n).forEach(function(x){p[x.type]=x.value;});
    dEl.textContent=p.year+'. '+p.month+'. '+p.day+' ('+p.weekday+')';
    tEl.textContent=ft.format(n).replace(/^24/,'00');
    if(window.BattleTime){var s=BattleTime.soonest(n.getTime());
      document.getElementById('nxName').textContent=s.live?s.b.name:(s.b.kind==='deadline'?'요신·결계지 주간 마감까지':s.b.name+'까지');
      document.getElementById('nxCd').textContent=s.live?'지금 전투 시작!':BattleTime.fmt(s.ms).text;}}
  tick();setInterval(tick,1000);

  /* 별 반짝임 */
  var c=document.getElementById('sky'),x=c.getContext('2d'),stars=[],dpr=Math.min(window.devicePixelRatio||1,2);
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){c.width=c.offsetWidth*dpr;c.height=c.offsetHeight*dpr;stars=[];
    var n=Math.round(c.offsetWidth*c.offsetHeight/2600);
    for(var i=0;i<n;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height*.75,r:(Math.random()*1.3+.3)*dpr,p:Math.random()*6.28,s:Math.random()*.02+.005});}
  function draw(){x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){var s=stars[i];s.p+=s.s;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));
      x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();}
    if(!still)requestAnimationFrame(draw);}
  size();draw();window.addEventListener('resize',function(){size();if(still)draw();});

  /* 떨어지는 잎 */
  if(!still){var h=document.querySelector('.hero');
    for(var i=0;i<9;i++){var l=document.createElement('i');l.className='leaf';
      l.style.left=(Math.random()*100)+'%';l.style.setProperty('--dx',(Math.random()*240-120)+'px');
      l.style.animationDuration=(10+Math.random()*10)+'s';l.style.animationDelay=(-Math.random()*20)+'s';
      if(i%3===0)l.style.background='#f2a7b8';h.appendChild(l);}}
})();
</script>
</body>
