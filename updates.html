<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>업데이트 · 짐승특공대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#16183a;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
.head{padding:48px 20px 28px;text-align:center;background:linear-gradient(180deg,#1b1d4d,#16183a)}
.head h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:clamp(32px,6vw,44px);margin:0}
.head p{color:#a9acd0;margin:8px 0 0;font-size:14px}
.list{max-width:860px;margin:0 auto;padding:8px 20px 64px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:center;padding:18px 20px;border-radius:12px;text-decoration:none;color:#fff;
  background:#1f2350;border:1px solid rgba(255,255,255,.07);transition:border-color .2s,transform .2s}
.row:hover{border-color:#ffd98a;transform:translateX(3px)}
.row .d{font-size:13px;color:#ffd98a;font-weight:700;font-variant-numeric:tabular-nums}
.row .t{font-family:"Do Hyeon",sans-serif;font-size:21px;display:block}
.row .s{font-size:13px;color:#b9bce0;display:block;margin-top:2px}
.row .ar{color:#ffd98a;font-size:20px}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .d{grid-column:1/-1}}
</style>
</head>
<body>
<header class="gnb">
  <a class="logo" href="index.html">짐승특공대<small>공월아1</small></a>
  <nav>
    <a href="index.html">홈</a>
    <a href="notice.html">문파 공지</a>
    <a href="members.html">문파원</a>
    <a href="battle.html">문파 전투</a>
    <a href="updates.html" class="on">업데이트</a>
    <a href="https://forum.kakaogames.com/dokkaebi" target="_blank" rel="noopener"><span class="pc">공식 </span>커뮤니티 ↗</a>
  </nav>
</header>
<div class="head"><h1>업데이트 브리핑</h1><p>최신 순으로 정리돼 있어요.</p></div>
<div class="list" id="list"></div>
<script src="updates.js?v=3"></script>
<script>
document.getElementById('list').innerHTML=(window.UPDATES||[]).map(function(u){
  return '<a class="row" href="'+u.file+'"><span class="d">'+u.date+'</span><span><span class="t">'+u.title+'</span><span class="s">'+u.summary+'</span></span><span class="ar">→</span></a>';
}).join('');
</script>
</body>
</html>
